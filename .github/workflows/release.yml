name: Release

# Releases happen when package.json "version" on main has no matching
# v<version> tag yet. Bump the version, add a CHANGELOG section, push to main.
# Pushing a v* tag by hand also works, as does "Run workflow" in the Actions tab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Decide whether to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.release == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.release == 'true'
        run: npm test
      - if: steps.check.outputs.release == 'true'
        run: npm run lint
      - if: steps.check.outputs.release == 'true'
        run: npm run build
      - name: Publish GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          notes=$(awk -v v="$VERSION" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "v$VERSION" build/*.xpi build/update.json \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes "${notes:-Release v$VERSION}"
